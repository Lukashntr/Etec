<!doctype html>
<html>
<lang="pt-br">
<head>

	<link rel="stylesheet" type="css/text" href="css/style.css" media="">
	<title>Formulário para entregar</title>

</head>
<body>
	<form>
		<fieldset>
			<thead> 
				<h1>Formulário para entregar</h1>
			</thead>
			
			<tbody>
			
				<div id="nome">
				
					<label><strong>NOME</strong></label><br>
						<input type="text" name="Nome" placeholder=" Insira seu nome completo">
				</div>
				
				
				<div>
						
					<label><strong>DATA DE NASCIMENTO</strong></label><br>
						<input type="date" name="dtnasc" placeholder="00/00/0000">
				</div>
				
				<div>
						
					<label><strong>E-MAIL</strong></label><br>
						<input type="email" name="E-mail" placeholder=" Exemplo: @etec.sp.gov.br">
				</div>
				
				<div>
						
					<label><strong>TELEFONE</strong></label><br>
						<input type="text" name="Telefone" placeholder=" (00) 0000-0000">
				</div>
				
				<div>	
				
					<label><strong>INFORME SUA SENHA</strong></label><br>
						<input type="password" name="senha" placeholder=" Digite sua senha">
				</div>
				
				<div>
					<label><strong>INFORME SUA CIDADE</strong></label><br>
					<select name="cyte" id="cyte ">
						<option value="SP">São Paulo</option>
						<option value="RJ">Rio De Janeiro</option>
						<option value="BA">Bahia</option>
						<option value="MG">Minas gerais</option>
					</select>
				</div>	
				
				<div>
				
					<label><strong>DEIXE SEU COMENTARIO AQUI</strong></label><br>
					
					<textarea name="Mensagem" id="Msg" cols="30" rows="10" ></textarea>
				</div>
				
			</tbody>
		</fieldset>
    </form>	

</body>
</html>
